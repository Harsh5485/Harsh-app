<svg width="360" height="640" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <rect width="360" height="640" fill="url(#bg)"/>

  <!-- Back button & Share -->
  <text x="20" y="40" font-family="sans-serif" font-size="20" fill="#ffffff">← Back</text>

  <!-- Hero Backdrop Image Placeholder -->
  <rect x="20" y="60" width="320" height="150" rx="16" fill="#1e293b"/>
  <circle cx="180" cy="135" r="28" fill="url(#accent)"/>
  <polygon points="176,126 176,144 190,135" fill="#ffffff"/>

  <!-- Title & Rating -->
  <text x="20" y="240" font-family="sans-serif" font-size="20" font-weight="bold" fill="#ffffff">Sci-Fi Adventure Series</text>
  <text x="20" y="260" font-family="sans-serif" font-size="12" fill="#38bdf8">⭐ 8.9 / 10 • 2026 • 2 Seasons • Sci-Fi / Action</text>

  <!-- Synopsis -->
  <text x="20" y="290" font-family="sans-serif" font-size="11" fill="#94a3b8">An epic journey across galaxies with instant streaming options,</text>
  <text x="20" y="305" font-family="sans-serif" font-size="11" fill="#94a3b8">multi-audio support, and high speed Telegram-Stremio integration.</text>

  <!-- Available Streams List Header -->
  <text x="20" y="340" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Available Streams &amp; Sources</text>

  <!-- Stream Item 1 -->
  <g transform="translate(20, 355)">
    <rect x="0" y="0" width="320" height="48" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="15" y="28" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff">1080p H.264 (Recommended)</text>
    <rect x="230" y="12" width="75" height="24" rx="12" fill="url(#accent)"/>
    <text x="245" y="28" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff">PLAY</text>
  </g>

  <!-- Stream Item 2 -->
  <g transform="translate(20, 415)">
    <rect x="0" y="0" width="320" height="48" rx="12" fill="#1e293b"/>
    <text x="15" y="28" font-family="sans-serif" font-size="12" font-weight="bold" fill="#94a3b8">4K HEVC Ultra HD Source</text>
    <rect x="230" y="12" width="75" height="24" rx="12" fill="#334155"/>
    <text x="245" y="28" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff">PLAY</text>
  </g>

  <!-- Stream Item 3 -->
  <g transform="translate(20, 475)">
    <rect x="0" y="0" width="320" height="48" rx="12" fill="#1e293b"/>
    <text x="15" y="28" font-family="sans-serif" font-size="12" font-weight="bold" fill="#94a3b8">720p Fast Stream Source</text>
    <rect x="230" y="12" width="75" height="24" rx="12" fill="#334155"/>
    <text x="245" y="28" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff">PLAY</text>
  </g>
</svg>
