<svg width="360" height="640" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="playerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <rect width="360" height="640" fill="url(#playerBg)"/>

  <!-- Simulated Video Canvas -->
  <rect x="0" y="160" width="360" height="240" fill="#090d16"/>
  <circle cx="180" cy="280" r="100" fill="#38bdf8" opacity="0.05"/>

  <!-- Top Overlay Bar -->
  <rect x="0" y="160" width="360" height="50" fill="black" opacity="0.4"/>
  <text x="20" y="190" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff">← Episode 1 - High Definition</text>
  <rect x="290" y="175" width="50" height="22" rx="11" fill="#38bdf8"/>
  <text x="300" y="190" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ffffff">1080p</text>

  <!-- Player Center Controls -->
  <circle cx="180" cy="280" r="30" fill="url(#accent)"/>
  <polygon points="175,270 175,290 190,280" fill="#ffffff"/>

  <text x="90" y="285" font-family="sans-serif" font-size="18" fill="#ffffff" opacity="0.8">⏮ 10s</text>
  <text x="230" y="285" font-family="sans-serif" font-size="18" fill="#ffffff" opacity="0.8">10s ⏭</text>

  <!-- Bottom Player Bar -->
  <rect x="0" y="350" width="360" height="50" fill="black" opacity="0.5"/>
  <text x="20" y="380" font-family="sans-serif" font-size="11" fill="#94a3b8">12:34</text>
  <text x="310" y="380" font-family="sans-serif" font-size="11" fill="#94a3b8">45:00</text>

  <!-- Progress Bar -->
  <rect x="55" y="375" width="250" height="4" rx="2" fill="#334155"/>
  <rect x="55" y="375" width="80" height="4" rx="2" fill="#38bdf8"/>
  <circle cx="135" cy="377" r="6" fill="#ffffff"/>

  <!-- Codec & Stream Info Section -->
  <g transform="translate(20, 430)">
    <rect x="0" y="0" width="320" height="180" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="20" y="30" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Adaptive Codec Engine</text>

    <rect x="20" y="45" width="280" height="32" rx="8" fill="#1e293b"/>
    <text x="30" y="66" font-family="sans-serif" font-size="11" fill="#38bdf8">✓ Auto Hardware / Software Fallback Enabled</text>

    <rect x="20" y="85" width="280" height="32" rx="8" fill="#1e293b"/>
    <text x="30" y="106" font-family="sans-serif" font-size="11" fill="#818cf8">✓ Seamless Stream Reset on Switch</text>

    <rect x="20" y="125" width="280" height="32" rx="8" fill="#1e293b"/>
    <text x="30" y="146" font-family="sans-serif" font-size="11" fill="#22d3ee">✓ Low-End Device Optimization</text>
  </g>
</svg>
