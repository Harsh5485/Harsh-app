<svg width="1200" height="500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="500" fill="url(#bg)"/>

  <!-- Subtle grid lines -->
  <path d="M0 100 H1200 M0 200 H1200 M0 300 H1200 M0 400 H1200" stroke="#334155" stroke-width="0.5" stroke-opacity="0.3"/>
  <path d="M200 0 V500 M400 0 V500 M600 0 V500 M800 0 V500 M1000 0 V500" stroke="#334155" stroke-width="0.5" stroke-opacity="0.3"/>

  <!-- Decorative circles -->
  <circle cx="200" cy="150" r="180" fill="#38bdf8" opacity="0.08"/>
  <circle cx="1000" cy="350" r="220" fill="#818cf8" opacity="0.08"/>

  <!-- Logo Icon Badge -->
  <rect x="100" y="160" width="100" height="100" rx="24" fill="url(#accent)"/>
  <polygon points="138,195 138,225 172,210" fill="#ffffff"/>

  <!-- Header Text -->
  <text x="230" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" fill="#ffffff">HARSH</text>
  <text x="230" y="250" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="600" fill="url(#accent)">PREMIUM MOVIES &amp; SERIES STREAMING</text>

  <!-- Features Badges -->
  <g transform="translate(100, 310)">
    <!-- Badge 1 -->
    <rect x="0" y="0" width="220" height="48" rx="12" fill="url(#cardBg)" stroke="#475569" stroke-width="1"/>
    <text x="20" y="30" font-family="sans-serif" font-size="16" font-weight="600" fill="#e2e8f0">⚡ Fast Playback</text>

    <!-- Badge 2 -->
    <rect x="240" y="0" width="240" height="48" rx="12" fill="url(#cardBg)" stroke="#475569" stroke-width="1"/>
    <text x="260" y="30" font-family="sans-serif" font-size="16" font-weight="600" fill="#e2e8f0">✈️ Telegram &amp; Stremio</text>

    <!-- Badge 3 -->
    <rect x="500" y="0" width="230" height="48" rx="12" fill="url(#cardBg)" stroke="#475569" stroke-width="1"/>
    <text x="520" y="30" font-family="sans-serif" font-size="16" font-weight="600" fill="#e2e8f0">🎬 1080p &amp; 4K Support</text>
  </g>

  <!-- UI Mockup Frame on Right -->
  <g transform="translate(850, 70)">
    <rect x="0" y="0" width="230" height="380" rx="28" fill="#020617" stroke="#334155" stroke-width="4"/>
    <!-- Phone Screen Header -->
    <rect x="15" y="15" width="200" height="40" rx="8" fill="#1e293b"/>
    <text x="30" y="40" font-family="sans-serif" font-size="14" font-weight="bold" fill="#38bdf8">Trending Movies</text>
    <!-- Movie Cards -->
    <rect x="15" y="65" width="92" height="130" rx="8" fill="#334155"/>
    <rect x="115" y="65" width="92" height="130" rx="8" fill="#334155"/>
    <rect x="15" y="205" width="92" height="130" rx="8" fill="#334155"/>
    <rect x="115" y="205" width="92" height="130" rx="8" fill="#334155"/>
    <circle cx="61" cy="130" r="16" fill="url(#accent)" opacity="0.9"/>
    <polygon points="57,123 57,137 69,130" fill="#ffffff"/>
  </g>
</svg>
